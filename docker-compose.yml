# Development: backend with auto-reload + Vite dev server.  Open http://localhost:5173
services:
  backend:
    build:
      context: .
      target: dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - data:/data
      - checkpoints:/checkpoints

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  data:
  checkpoints:
  node_modules:
